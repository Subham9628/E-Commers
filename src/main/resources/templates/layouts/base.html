<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSphere - <th:block th:text="${pageTitle}">Home</th:block></title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- jQuery UI CSS (for slider) -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
	
	
	<link rel="stylesheet" href="/css/style.css">
	</head>
	
<body class="d-flex flex-column min-vh-100">
	<div th:fragment="base(content)">
		
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="fas fa-store"></i> ShopSphere
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
				<!-- Replace the navigation ul section with this -->
				<ul class="navbar-nav me-auto">
				    <li class="nav-item">
				        <a class="nav-link" th:href="@{/}">Home</a>
				    </li>
				    <li class="nav-item">
				        <a class="nav-link" th:href="@{/products}">Products</a>
				    </li>
				</ul>
				<form class="d-flex me-3" th:action="@{/products}" method="get">
				    <input class="form-control me-2" type="search" name="keyword" placeholder="Search products...">
				    <button class="btn btn-outline-success" type="submit">Search</button>
				</form>
				<ul class="navbar-nav">
				    <li class="nav-item">
				        <a class="nav-link position-relative" th:href="@{/cart}">
				            <i class="fas fa-shopping-cart"></i> Cart
				            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
				        </a>
				    </li>
				    <!-- Show different links based on authentication -->
				    <li class="nav-item" sec:authorize="isAnonymous()">
				        <a class="nav-link" th:href="@{/login}">
				            <i class="fas fa-sign-in-alt"></i> Login
				        </a>
				    </li>
				    <li class="nav-item" sec:authorize="isAnonymous()">
				        <a class="nav-link" th:href="@{/register}">
				            <i class="fas fa-user-plus"></i> Register
				        </a>
				    </li>
				    <li class="nav-item" sec:authorize="isAuthenticated()">
				        <a class="nav-link" th:href="@{/logout}">
				            <i class="fas fa-sign-out-alt"></i> Logout
				        </a>
				    </li>
				</ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">
		
		 <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
		
        <div class="container text-center">
            <p>&copy; 2026 ShopSphere. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
	<!-- Back to Top Button -->
	<button id="back-to-top" class="btn btn-primary rounded-circle position-fixed" 
	        style="bottom: 30px; right: 30px; width: 50px; height: 50px; display: none; z-index: 1000;">
	    <i class="fas fa-arrow-up"></i>
	</button>
	<script th:src="@{/js/main.js}"></script>	
	</div>
	</body>
</html>
